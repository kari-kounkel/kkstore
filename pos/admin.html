<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>K Co Register — Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Mono:wght@400;500&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#E0381F; --orange:#F07830; --navy:#3a2a22; --text:#2e231d;
    --muted:#a3917f; --border:#f0e2d6; --off:#FDF7F2; --white:#fff;
    --green:#1f7a4d; --green-light:#e7f5ee;
    --shadow:0 2px 10px rgba(58,42,34,.08);
    --shadow-lg:0 18px 44px rgba(224,56,32,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Nunito Sans',system-ui,sans-serif;color:var(--text);
    background:var(--off);padding-bottom:80px;-webkit-text-size-adjust:100%;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:16px}
  .mono{font-family:'DM Mono',monospace}

  .bar{
    background:var(--white);border-bottom:1.5px solid var(--border);
    padding:14px 20px;display:flex;align-items:center;gap:14px;
    position:sticky;top:0;z-index:40;box-shadow:var(--shadow);flex-wrap:wrap;
  }
  .brand{font-family:Georgia,serif;font-size:22px;font-weight:900;color:var(--pink)}
  .brand em{color:var(--orange);font-style:italic}
  .bar-spacer{flex:1}
  .back{
    font-family:'DM Mono',monospace;font-size:13px;color:var(--white);background:var(--navy);
    padding:11px 20px;border-radius:100px;text-decoration:none;display:inline-block;
  }

  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px}
  .card{
    background:var(--white);border:1.5px solid var(--border);border-radius:20px;
    padding:22px;margin-bottom:20px;box-shadow:var(--shadow);
  }
  h2{
    font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;
    color:var(--muted);margin-bottom:16px;
  }
  h3{font-size:19px;font-weight:800;margin-bottom:4px}
  .hand{font-family:'Caveat',cursive;font-size:20px;color:var(--muted)}

  label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
  .in{
    width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:12px;
    background:var(--off);color:var(--text);
  }
  .in:focus{outline:none;border-color:var(--orange);background:#fff}
  .row{display:grid;gap:14px;margin-bottom:14px}
  .row.c2{grid-template-columns:1fr 1fr}
  .row.c3{grid-template-columns:2fr 1fr 1fr}
  @media(max-width:680px){ .row.c2,.row.c3{grid-template-columns:1fr} }

  .btn{
    padding:13px 22px;border-radius:12px;font-size:14px;font-weight:800;
    text-transform:uppercase;letter-spacing:.05em;display:inline-flex;
    align-items:center;justify-content:center;gap:7px;min-height:48px;
  }
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.4;pointer-events:none}
  .btn-p{background:var(--pink);color:#fff}
  .btn-d{background:var(--navy);color:#fff}
  .btn-g{background:var(--white);border:2px solid var(--border);color:var(--navy)}
  .btn-sm{padding:8px 14px;min-height:40px;font-size:12px}

  /* events */
  .ev{
    display:flex;align-items:center;gap:14px;padding:14px;border:2px solid var(--border);
    border-radius:14px;margin-bottom:10px;background:var(--off);flex-wrap:wrap;
  }
  .ev.live{border-color:var(--green);background:var(--green-light)}
  .ev-main{flex:1;min-width:190px}
  .ev-name{font-size:17px;font-weight:800}
  .ev-meta{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);margin-top:3px}
  .badge{
    font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;padding:4px 11px;
    border-radius:100px;background:var(--green);color:#fff;text-transform:uppercase;
  }

  /* item rows */
  .item{
    display:grid;grid-template-columns:auto 1fr 108px 92px auto auto;gap:10px;
    align-items:center;padding:10px;border:2px solid var(--border);border-radius:12px;
    margin-bottom:8px;background:var(--white);
  }
  @media(max-width:760px){
    .item{grid-template-columns:auto 1fr auto;grid-auto-rows:min-content}
    .item .ig{grid-column:2/-1}
  }
  .grab{display:flex;flex-direction:column;gap:2px}
  .grab button{
    width:34px;height:26px;border-radius:7px;background:var(--off);
    font-size:13px;line-height:1;color:var(--navy);
  }
  .grab button:active{background:var(--border)}
  .item .in{padding:10px 12px;font-size:15px}
  .x{
    width:40px;height:40px;border-radius:10px;background:#fdeae5;color:var(--pink);
    font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .tax{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
  .tax input{width:22px;height:22px;accent-color:var(--pink)}

  /* report */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--off);border:2px solid var(--border);border-radius:16px;padding:16px;text-align:center}
  .kpi.big{background:linear-gradient(140deg,#fff6ef,#ffeadf);border-color:#f6d3bc}
  .kpi-n{font-family:'DM Mono',monospace;font-size:28px;font-weight:500;color:var(--pink);line-height:1.1}
  .kpi.big .kpi-n{font-size:36px}
  .kpi-l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:6px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{
    text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--border);
  }
  td{padding:10px;border-bottom:1px solid var(--border)}
  td.n{font-family:'DM Mono',monospace;text-align:right}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .pill{font-family:'DM Mono',monospace;font-size:10px;padding:3px 9px;border-radius:100px;
    background:var(--off);border:1px solid var(--border);text-transform:uppercase}
  .pill.cash{background:#f2ecf7} .pill.card{background:#fdeae5}

  .veil{position:fixed;inset:0;background:rgba(46,35,29,.55);display:flex;
    align-items:center;justify-content:center;padding:20px;z-index:70}
  .sheet{background:#fff;border-radius:22px;width:100%;max-width:560px;
    max-height:84vh;overflow-y:auto;padding:24px;box-shadow:var(--shadow-lg)}
  .pick{
    display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--border);
  }
  .pick:active{background:var(--off)}
  .pick-main{flex:1;min-width:0}
  .pick-t{font-size:15px;font-weight:700}
  .pick-m{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}

  .note{
    background:#fff6ef;border:2px solid #f6d3bc;border-radius:14px;padding:14px 16px;
    font-size:14px;line-height:1.55;margin-bottom:16px;
  }
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);
    color:#fff;padding:14px 26px;border-radius:100px;font-size:15px;font-weight:700;
    z-index:95;box-shadow:var(--shadow-lg);max-width:88vw;text-align:center;
  }
  .hidden{display:none !important}
  .gate{position:fixed;inset:0;z-index:90;background:var(--off);display:flex;
    flex-direction:column;align-items:center;justify-content:center;padding:28px}
  .err{color:var(--pink);font-size:14px;text-align:center;margin:10px 0;font-weight:700;min-height:20px}
  .muted{color:var(--muted);font-size:14px}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="brand" style="font-size:36px">K<em>Co</em> Register</div>
  <div class="hand" style="margin-bottom:20px">setup &amp; totals</div>
  <div style="width:100%;max-width:360px">
    <input class="in mono" id="code" type="password" inputmode="numeric" placeholder="passcode" style="text-align:center">
    <div class="err" id="gateErr"></div>
    <button class="btn btn-p" id="unlock" style="width:100%">Unlock</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="bar">
    <div class="brand">K<em>Co</em></div>
    <div style="font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">Register setup</div>
    <div class="bar-spacer"></div>
    <a class="back" href="./">← Back to the register</a>
  </div>

  <div class="wrap">

    <!-- new event -->
    <div class="card">
      <h2>Start a new event</h2>
      <div class="row c3">
        <div><label>Event name</label><input class="in" id="nName" placeholder="Fall Craft Fair"></div>
        <div><label>Date</label><input class="in" id="nDate" type="date"></div>
        <div><label>Sales tax %</label><input class="in" id="nTax" type="number" step="0.001" placeholder="0" inputmode="decimal"></div>
      </div>
      <button class="btn btn-p" id="createBtn">Create event</button>
      <span class="hand" style="margin-left:12px">leave tax at 0 if you're not collecting it</span>
    </div>

    <!-- events -->
    <div class="card">
      <h2>Events</h2>
      <div id="evList"></div>
    </div>

    <!-- items -->
    <div class="card" id="itemsCard">
      <h2>Buttons on the register</h2>
      <div id="itemsHead"></div>
      <div id="itemList"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
        <button class="btn btn-g" id="addCatalog">+ From the shop catalog</button>
        <button class="btn btn-g" id="addBlank">+ Blank button</button>
        <button class="btn btn-p" id="saveItems">Save buttons</button>
      </div>
    </div>

    <!-- report -->
    <div class="card" id="reportCard">
      <h2>Event totals</h2>
      <div id="report"></div>
    </div>

  </div>
</div>

<script>
(function(){
"use strict";

var SUPABASE_URL = 'https://lheytkgixafdhluuvrbg.supabase.co';
var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxoZXl0a2dpeGFmZGhsdXV2cmJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0NDUxOTksImV4cCI6MjA5MTAyMTE5OX0.ACGgv_cHHLJTP_-Bqj1pwosc6heo8l_4VWoWlHNiV7s';
var API = SUPABASE_URL + '/functions/v1/pos';

var $ = function(id){ return document.getElementById(id); };
var code = '', events = [], sel = null, items = [], catalog = null;

var fmt = function(n){ return '$' + (Math.round((Number(n)||0)*100)/100).toFixed(2); };
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function api(action, payload){
  return fetch(API, {
    method:'POST',
    headers:{
      'Content-Type':'application/json','apikey':SUPABASE_ANON,
      'Authorization':'Bearer ' + SUPABASE_ANON,'x-pos-code':code
    },
    body: JSON.stringify(Object.assign({action:action}, payload||{}))
  }).then(function(r){
    return r.json().then(function(j){
      if (!r.ok) throw new Error(j.error || ('Error ' + r.status));
      return j;
    });
  });
}

var toastTimer;
function toast(m){
  var old = document.querySelector('.toast');
  if (old) old.parentNode.removeChild(old);
  var t = document.createElement('div');
  t.className = 'toast'; t.textContent = m;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 3200);
}

/* ---------------- gate ---------------- */
function unlock(){
  var v = $('code').value.trim();
  if (!v) return;
  code = v;
  $('gateErr').textContent = 'checking…';
  api('events.list', {}).then(function(d){
    try { localStorage.setItem('kco_pos_code', code); } catch(e){}
    $('gate').classList.add('hidden');
    $('app').classList.remove('hidden');
    events = d.events || [];
    var live = events.filter(function(e){ return e.active; })[0];
    sel = live ? live.id : (events[0] ? events[0].id : null);
    drawEvents();
    if (sel) loadEvent(sel);
  }).catch(function(e){ code=''; $('gateErr').textContent = e.message; });
}
$('unlock').addEventListener('click', unlock);
$('code').addEventListener('keydown', function(e){ if (e.key === 'Enter') unlock(); });
try {
  var saved = localStorage.getItem('kco_pos_code');
  if (saved) { $('code').value = saved; unlock(); }
} catch(e){}

/* ---------------- events ---------------- */
$('createBtn').addEventListener('click', function(){
  var name = $('nName').value.trim();
  if (!name) return toast('Give it a name first.');
  api('events.create', {
    name: name,
    event_date: $('nDate').value || null,
    tax_rate: (parseFloat($('nTax').value) || 0) / 100
  }).then(function(d){
    $('nName').value = ''; $('nDate').value = ''; $('nTax').value = '';
    return api('events.activate', { event_id: d.event.id }).then(function(){ return d.event.id; });
  }).then(function(id){
    return api('events.list', {}).then(function(d){
      events = d.events || []; sel = id; drawEvents(); loadEvent(id);
      toast('Event created and opened. Go sell something.');
    });
  }).catch(function(e){ toast(e.message); });
});

function drawEvents(){
  var box = $('evList');
  if (!events.length){
    box.innerHTML = '<div class="muted">No events yet. Make one above.</div>';
    return;
  }
  box.innerHTML = '';
  events.forEach(function(e){
    var d = document.createElement('div');
    d.className = 'ev' + (e.active ? ' live' : '') ;
    var meta = [];
    if (e.event_date) meta.push(e.event_date);
    meta.push(Number(e.tax_rate) > 0 ? 'tax ' + (Number(e.tax_rate)*100).toFixed(3).replace(/\.?0+$/,'') + '%' : 'no tax');
    d.innerHTML =
      '<div class="ev-main"><div class="ev-name">' + esc(e.name) +
      (e.active ? ' <span class="badge">open</span>' : '') + '</div>' +
      '<div class="ev-meta">' + esc(meta.join('  ·  ')) + '</div></div>';

    var pick = document.createElement('button');
    pick.className = 'btn btn-g btn-sm';
    pick.textContent = sel === e.id ? 'Editing' : 'Edit';
    pick.disabled = sel === e.id;
    pick.addEventListener('click', function(){ sel = e.id; drawEvents(); loadEvent(e.id); });
    d.appendChild(pick);

    var act = document.createElement('button');
    act.className = 'btn btn-sm ' + (e.active ? 'btn-g' : 'btn-d');
    act.textContent = e.active ? 'Close' : 'Open register';
    act.addEventListener('click', function(){
      api(e.active ? 'events.close' : 'events.activate', { event_id: e.id })
        .then(function(){ return api('events.list', {}); })
        .then(function(d){
          events = d.events || []; drawEvents();
          toast(e.active ? 'Closed. The register has no event open.' : 'Open. The iPad is ready.');
        }).catch(function(err){ toast(err.message); });
    });
    d.appendChild(act);
    box.appendChild(d);
  });
}

function current(){ return events.filter(function(e){ return e.id === sel; })[0]; }

function loadEvent(id){
  var e = current();
  $('itemsHead').innerHTML =
    '<div class="row c3">' +
    '<div><label>Event name</label><input class="in" id="eName" value="' + esc(e.name) + '"></div>' +
    '<div><label>Date</label><input class="in" id="eDate" type="date" value="' + esc(e.event_date || '') + '"></div>' +
    '<div><label>Sales tax %</label><input class="in" id="eTax" type="number" step="0.001" inputmode="decimal" value="' +
      (Number(e.tax_rate)*100).toFixed(3).replace(/\.?0+$/,'') + '"></div>' +
    '</div>' +
    '<button class="btn btn-g btn-sm" id="saveEv" style="margin-bottom:18px">Save event details</button>';

  $('saveEv').addEventListener('click', function(){
    api('events.update', {
      event_id: sel,
      name: $('eName').value.trim() || e.name,
      event_date: $('eDate').value || null,
      tax_rate: (parseFloat($('eTax').value) || 0) / 100
    }).then(function(){ return api('events.list', {}); })
      .then(function(d){ events = d.events || []; drawEvents(); toast('Saved.'); })
      .catch(function(err){ toast(err.message); });
  });

  api('items.load', { event_id: id }).then(function(d){
    items = d.items || []; drawItems();
  }).catch(function(err){
    items = []; drawItems(); toast(err.message);
  });

  drawReport(id);
}

/* ---------------- items ---------------- */
function drawItems(){
  var box = $('itemList');
  if (!items.length){
    box.innerHTML = '<div class="muted">No buttons yet. Add some below — they show up on the iPad in this order.</div>';
    return;
  }
  box.innerHTML = '';
  items.forEach(function(it, i){
    var d = document.createElement('div');
    d.className = 'item';
    d.innerHTML =
      '<div class="grab"><button data-up>▲</button><button data-down>▼</button></div>' +
      '<div class="ig"><input class="in" data-label value="' + esc(it.label) + '" placeholder="Button label"></div>' +
      '<div class="ig"><input class="in mono" data-price type="number" step="0.01" inputmode="decimal" value="' +
        (it.price != null ? Number(it.price).toFixed(2) : '') + '" placeholder="0.00"></div>' +
      '<div class="ig"><input class="in mono" data-stock type="number" inputmode="numeric" value="' +
        (it.stock_qty == null ? '' : it.stock_qty) + '" placeholder="stock"></div>' +
      '<label class="tax"><input type="checkbox" data-tax ' + (it.taxable !== false ? 'checked' : '') + '>tax</label>' +
      '<button class="x" data-del aria-label="Remove">×</button>';

    d.querySelector('[data-up]').addEventListener('click', function(){
      if (i === 0) return;
      var t = items[i-1]; items[i-1] = items[i]; items[i] = t; drawItems();
    });
    d.querySelector('[data-down]').addEventListener('click', function(){
      if (i === items.length-1) return;
      var t = items[i+1]; items[i+1] = items[i]; items[i] = t; drawItems();
    });
    d.querySelector('[data-del]').addEventListener('click', function(){ items.splice(i,1); drawItems(); });
    d.querySelector('[data-label]').addEventListener('input', function(){ it.label = this.value; });
    d.querySelector('[data-price]').addEventListener('input', function(){ it.price = this.value; });
    d.querySelector('[data-stock]').addEventListener('input', function(){ it.stock_qty = this.value; });
    d.querySelector('[data-tax]').addEventListener('change', function(){ it.taxable = this.checked; });
    box.appendChild(d);
  });
}

$('addBlank').addEventListener('click', function(){
  items.push({ product_id:null, label:'', price:'', taxable:true, stock_qty:'' });
  drawItems();
});

$('addCatalog').addEventListener('click', function(){
  var open = function(){
    var v = document.createElement('div');
    v.className = 'veil';
    var rows = catalog.map(function(p){
      return '<div class="pick" data-id="' + p.id + '">' +
        '<div class="pick-main"><div class="pick-t">' + esc(p.title) + '</div>' +
        '<div class="pick-m">' + (p.price != null ? fmt(p.price) : 'no price set') +
        '  ·  ' + esc(p.status) + '</div></div>' +
        '<span class="btn btn-g btn-sm">Add</span></div>';
    }).join('');
    v.innerHTML = '<div class="sheet"><h3>Shop catalog</h3>' +
      '<div class="hand" style="margin-bottom:14px">tap to add — you can change the price after</div>' +
      rows + '<button class="btn btn-g" id="_close" style="width:100%;margin-top:16px">Done</button></div>';
    document.body.appendChild(v);
    v.querySelectorAll('.pick').forEach(function(row){
      row.addEventListener('click', function(){
        var p = catalog.filter(function(x){ return x.id === row.getAttribute('data-id'); })[0];
        items.push({
          product_id: p.id,
          label: p.title,
          price: p.price != null ? Number(p.price).toFixed(2) : '',
          taxable: true, stock_qty: ''
        });
        drawItems();
        toast('Added ' + p.title + (p.price == null ? ' — set a price' : ''));
      });
    });
    function close(){ document.body.removeChild(v); }
    v.querySelector('#_close').addEventListener('click', close);
    v.addEventListener('click', function(e){ if (e.target === v) close(); });
  };
  if (catalog) return open();
  api('catalog', {}).then(function(d){ catalog = d.products || []; open(); }).catch(function(e){ toast(e.message); });
});

$('saveItems').addEventListener('click', function(){
  if (!sel) return toast('Pick an event first.');
  var bad = items.filter(function(it){ return !it.label || !(Number(it.price) > 0); });
  if (bad.length) return toast('Every button needs a label and a price above zero.');
  api('items.save', { event_id: sel, items: items }).then(function(d){
    items = d.items || []; drawItems(); toast('Saved. The iPad will pick these up.');
  }).catch(function(e){ toast(e.message); });
});

/* ---------------- report ---------------- */
function drawReport(id){
  api('report', { event_id: id }).then(function(d){
    var t = d.totals || {};
    var box = $('report');
    var kpis =
      '<div class="kpis">' +
      '<div class="kpi big"><div class="kpi-n">' + fmt(t.gross) + '</div><div class="kpi-l">Total taken</div></div>' +
      '<div class="kpi"><div class="kpi-n">' + fmt(t.card_total) + '</div><div class="kpi-l">Card</div></div>' +
      '<div class="kpi"><div class="kpi-n">' + fmt(t.cash_total) + '</div><div class="kpi-l">Cash</div></div>' +
      (Number(t.link_total) > 0 ? '<div class="kpi"><div class="kpi-n">' + fmt(t.link_total) + '</div><div class="kpi-l">Phone</div></div>' : '') +
      '<div class="kpi"><div class="kpi-n">' + (t.sale_count || 0) + '</div><div class="kpi-l">Sales</div></div>' +
      '<div class="kpi"><div class="kpi-n">' + fmt(t.tax_collected) + '</div><div class="kpi-l">Tax collected</div></div>' +
      (Number(t.discounts_given) > 0 ? '<div class="kpi"><div class="kpi-n">' + fmt(t.discounts_given) + '</div><div class="kpi-l">Discounts</div></div>' : '') +
      '</div>';

    var byItem = '';
    if ((d.by_item || []).length){
      byItem = '<h2 style="margin-top:22px">What sold</h2><div class="scroll"><table><thead><tr>' +
        '<th>Item</th><th style="text-align:right">Qty</th><th style="text-align:right">Gross</th>' +
        '</tr></thead><tbody>' +
        d.by_item.map(function(r){
          return '<tr><td>' + esc(r.label) + '</td><td class="n">' + r.qty + '</td><td class="n">' + fmt(r.gross) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }

    var stock = '';
    if ((d.stock || []).length){
      stock = '<h2 style="margin-top:22px">Stock left</h2><div class="scroll"><table><tbody>' +
        d.stock.map(function(s){
          return '<tr><td>' + esc(s.label) + '</td><td class="n">' +
            (s.stock_qty <= 0 ? '<strong style="color:var(--pink)">sold out</strong>' : s.stock_qty) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }

    var paid = (d.sales || []).filter(function(s){ return s.status === 'paid'; });
    var log = '';
    if (paid.length){
      log = '<h2 style="margin-top:22px">Every sale</h2><div class="scroll"><table><thead><tr>' +
        '<th>Time</th><th>Tender</th><th style="text-align:right">Total</th><th>Email</th>' +
        '</tr></thead><tbody>' +
        paid.map(function(s){
          var when = new Date(s.paid_at || s.created_at);
          return '<tr><td class="mono" style="font-size:12px">' +
            when.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) + '</td>' +
            '<td><span class="pill ' + esc(s.tender) + '">' + esc(s.tender) + '</span></td>' +
            '<td class="n">' + fmt(s.total) + '</td>' +
            '<td class="muted" style="font-size:12px">' + esc(s.customer_email || '') + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<button class="btn btn-g btn-sm" id="csv" style="margin-top:14px">Download CSV</button>';
    }

    box.innerHTML = kpis + byItem + stock + log +
      (paid.length ? '' : '<div class="muted">No paid sales for this event yet.</div>');

    var c = $('csv');
    if (c) c.addEventListener('click', function(){ downloadCsv(current(), paid); });
  }).catch(function(e){ $('report').innerHTML = '<div class="muted">' + esc(e.message) + '</div>'; });
}

function downloadCsv(ev, sales){
  var head = ['date','tender','subtotal','discount','tax','total','email','stripe_payment_intent','sale_id'];
  var body = sales.map(function(s){
    return [
      new Date(s.paid_at || s.created_at).toISOString(),
      s.tender, s.subtotal, s.discount, s.tax, s.total,
      s.customer_email || '', s.stripe_payment_intent || '', s.id
    ].map(function(v){ return '"' + String(v).replace(/"/g,'""') + '"'; }).join(',');
  });
  var csv = head.join(',') + '\n' + body.join('\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
  a.download = (ev ? ev.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase() : 'event') + '-sales.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

})();
</script>
</body>
</html>
