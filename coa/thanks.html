<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — your Court of Accounts PDF</title>
<meta name="robots" content="noindex">
<!-- Google Analytics 4 — shared karikounkel property -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WHKMKCD1SD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-WHKMKCD1SD');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600&family=Mulish:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
:root{
  /* Straight off the book cover — royal purple, vivid orange, gold, on white */
  --bg:#FFFFFF;--card-edge:rgba(91,42,154,.14);
  --gold:#E9A72C;--gold-deep:#C6871A;--gold-bright:#F5C24B;
  --purple:#5B2A9A;--purple-deep:#340B67;--purple-bright:#7B3FC4;
  --orange:#E8531E;--orange-deep:#C13D0E;--orange-bright:#FF6A33;
  --ink:#241333;--ink-soft:#5E4E72;--ink-dim:#9384A6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Mulish',sans-serif;color:var(--ink);background:var(--bg);line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at 50% -6%,#FFFFFF 0%,#FBF7FE 46%,#F4ECFB 100%)}
.nav{padding:22px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(154,114,32,.12)}
.nav a.back{text-decoration:none;color:var(--ink-soft);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.7rem;transition:color .2s}
.nav a.back:hover{color:var(--orange)}
.nav .brand{font-family:'Fraunces',serif;font-style:italic;font-weight:600;color:var(--gold-deep);font-size:.95rem}
.wrap{max-width:620px;width:100%;margin:0 auto;padding:60px 28px 90px;flex:1;text-align:center}
.crest{font-size:3.2rem;line-height:1;margin-bottom:14px}
.kicker{font-family:'Mulish',sans-serif;font-weight:800;letter-spacing:.3em;text-transform:uppercase;font-size:.72rem;color:var(--orange);margin-bottom:14px}
h1{font-family:'Fraunces',serif;font-weight:800;color:var(--ink);font-size:clamp(2.1rem,6vw,3rem);line-height:1.05;letter-spacing:-.015em;margin-bottom:18px}
.lede{font-family:'Fraunces',serif;font-style:italic;color:var(--ink-soft);font-size:clamp(1.1rem,2.6vw,1.25rem);max-width:44ch;margin:0 auto 34px;line-height:1.55}
.card{background:#FFFDF7;border:1.5px solid var(--card-edge);border-radius:22px;padding:36px 32px;box-shadow:0 18px 40px rgba(146,106,23,.09);max-width:480px;margin:0 auto}
.spinner{width:42px;height:42px;border:3.5px solid rgba(198,151,47,.2);border-top-color:var(--gold);border-radius:50%;margin:6px auto 18px;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-block;text-decoration:none;font-family:'Mulish',sans-serif;font-weight:800;letter-spacing:.06em;font-size:.9rem;background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#3A2B0C;padding:18px 42px;border-radius:999px;box-shadow:0 12px 26px rgba(198,151,47,.3);transition:all .25s;border:0;cursor:pointer}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(198,151,47,.4)}
.expires{font-family:'Fraunces',serif;font-style:italic;color:var(--ink-soft);font-size:.92rem;margin-top:18px}
.hint{font-family:'Mulish',sans-serif;font-size:.82rem;color:var(--ink-dim);margin-top:14px;max-width:38ch;margin-left:auto;margin-right:auto;line-height:1.5}
.hint a{color:var(--gold-deep);font-weight:700}
.error{padding:18px 22px;background:rgba(168,50,30,.06);border:1px solid rgba(168,50,30,.25);border-radius:14px;color:var(--orange-deep);font-size:.94rem;text-align:left}
.error h3{font-family:'Fraunces',serif;font-weight:700;margin-bottom:6px;font-size:1.1rem;color:var(--orange-deep)}
.error a{color:var(--orange-deep);font-weight:700;text-decoration:underline}
footer{text-align:center;padding:30px 28px;color:var(--ink-dim);font-size:.78rem;font-family:'Fraunces',serif;font-style:italic}
.home-link{display:inline-block;margin-top:32px;font-family:'Mulish',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--orange);text-decoration:none;border-bottom:1.5px solid var(--orange);padding-bottom:2px}
.home-link:hover{color:var(--orange-deep)}
</style>
</head>
<body>

<nav class="nav">
  <a class="back" href="index.html">← Back to the book</a>
  <span class="brand">Court of Accounts</span>
</nav>

<main class="wrap">
  <div class="crest">🥚👑🥚</div>
  <p class="kicker">Thank you</p>
  <h1 id="headline">Your PDF is on the way.</h1>
  <p class="lede" id="lede">Hang on one breath while we confirm your order with Stripe…</p>

  <div class="card" id="card">
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <p id="status" style="color:var(--ink-soft);font-family:'Fraunces',serif;font-style:italic">Verifying your purchase…</p>
  </div>

  <a class="home-link" href="index.html">← Back to the book</a>
</main>

<footer>The court is glad you're here. 🐪</footer>

<!-- Ask Kari widget -->
<script src="https://chat.karikounkel.com/widget.js" defer></script>
<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const sid = params.get('session_id');
  const card = document.getElementById('card');
  const headline = document.getElementById('headline');
  const lede = document.getElementById('lede');

  function showError(title, body, retryable) {
    card.innerHTML =
      '<div class="error"><h3>' + escapeHtml(title) + '</h3><p>' + body + '</p></div>' +
      (retryable
        ? '<p class="hint">Try refreshing this page. If it keeps failing, email <a href="mailto:kari@karikounkel.com">kari@karikounkel.com</a> with your receipt and we\'ll send your PDF manually.</p>'
        : '<p class="hint">Email <a href="mailto:kari@karikounkel.com">kari@karikounkel.com</a> with your receipt and we\'ll get this sorted.</p>');
  }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));}

  if (!sid) {
    headline.textContent = "Hmm — that link is missing something.";
    lede.textContent = "There's no Stripe session in the URL. If you came from a confirmation email, check the link.";
    showError("Missing session ID", "We can't verify a purchase without the session_id parameter in the URL.", false);
    return;
  }

  fetch('/api/get-pdf?session_id=' + encodeURIComponent(sid), { cache: 'no-store' })
    .then(r => r.json().then(j => ({ status: r.status, body: j })))
    .then(({ status, body }) => {
      if (status === 200 && body && body.url) {
        const expires = body.expires_at ? new Date(body.expires_at) : null;
        const expiresStr = expires
          ? expires.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) +
            ' at ' + expires.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })
          : 'in 7 days';
        headline.textContent = "Your book is ready.";
        lede.innerHTML = 'Click below to download <em>Court of Accounts</em>. The link is valid until ' + escapeHtml(expiresStr) + ' — <strong>save the file to your device</strong> once you open it.';
        card.innerHTML =
          '<a class="btn" href="' + body.url + '" download="Court-of-Accounts.pdf">Download the PDF 🥚</a>' +
          '<p class="expires">Link expires ' + escapeHtml(expiresStr) + '.</p>' +
          '<p class="hint">Don\'t forget the <a href="tools.html">Kingdom Tools workbook</a> — it\'s free with your book. Save the PDF to your device; once the link expires, this exact URL stops working. Need a fresh one? Email <a href="mailto:kari@karikounkel.com">kari@karikounkel.com</a> with the email you bought with.</p>';
      } else if (status === 403 && body && body.error === 'not_paid') {
        headline.textContent = "Stripe says this order isn't paid yet.";
        lede.textContent = "Sometimes the redirect lands a few seconds before Stripe finalizes the charge. Try refreshing in a moment.";
        showError("Payment not confirmed", "Stripe reports this session as: " + escapeHtml(body.payment_status || 'unknown'), true);
      } else if (status === 400) {
        headline.textContent = "That link looks off.";
        lede.textContent = "We couldn't read a valid Stripe session ID from the URL.";
        showError("Invalid session", "The session_id in the URL doesn't look like a real Stripe Checkout Session.", false);
      } else {
        headline.textContent = "We hit a snag.";
        lede.textContent = "Your purchase looks fine — we just couldn't generate the download link automatically.";
        showError("Couldn't prepare your download", "Error: " + escapeHtml((body && body.error) || ('HTTP ' + status)), true);
      }
    })
    .catch(err => {
      headline.textContent = "We hit a snag.";
      showError("Connection failed", "Couldn't reach the server: " + escapeHtml(err.message || err), true);
    });
})();
</script>

</body>
</html>
